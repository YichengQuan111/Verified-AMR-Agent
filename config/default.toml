# 项目默认配置。敏感值可在本机用环境变量覆盖，不要把真实密钥写回本文件。
[app]
name = "amr-agent-api"
version = "0.1.0"
environment = "development"

[logging]
level = "INFO"
# true 时每条日志都是一行 JSON，便于机器解析和后续证据报告。
json = true

[model_gateway]
# 一个进程只选择一个 Profile；运行中不执行 Fast/Smart 热切换。
profile = "fast"
base_url = "http://127.0.0.1:8080/v1"
api_key = "dummy"
connect_timeout_seconds = 3.0
generation_timeout_seconds = 120.0
max_schema_repair_attempts = 1
max_output_tokens = 1024
# true 时 API 启动前必须通过 /v1/models alias 门禁。
validate_on_startup = true

[model_gateway.profiles.fast]
alias = "qwen3.6-fast"
context_window = 8192
temperature = 0.0
reasoning_enabled = false
reasoning_budget_tokens = 0

[model_gateway.profiles.smart]
alias = "qwen3.8-smart"
context_window = 12288
temperature = 0.0
reasoning_enabled = true
# Smart 允许思考，但限制预算，避免只生成 reasoning_content 而没有最终 JSON。
reasoning_budget_tokens = 512

[database]
postgres_dsn = "postgresql://amr:123456@localhost:5432/amr_agent"

[retrieval]
qdrant_url = "http://localhost:6333"
collection_name = "amr_warehouse_knowledge"
# 本地模型路径是当前 P0 固定环境；维度由运行时模型动态读取，不在配置中写死。
embedding_model_path = "E:\\Llama.cpp\\Embedding"
embedding_device = "cpu"
embedding_batch_size = 8
# 只在单个二级章节超过此上限时进行语义块二次拆分。
chunk_max_chars = 1800
default_top_k = 5
candidate_multiplier = 4
vector_weight = 0.5
bm25_weight = 0.5
bm25_saturation = 3.0
# 20 例真实评测：可答最低 0.821220、不可答最高 0.797038；取中点约 0.809。
# 模型、语料或融合方式变化后必须重新观察分布，不应永久照搬此值。
minimum_hybrid_score = 0.809
# hybrid 未达标子集：短语义改写 top vector=0.597388，不可答最高=0.400358。
minimum_vector_score = 0.499
