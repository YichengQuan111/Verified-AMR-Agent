# 项目默认配置。敏感值可在本机用环境变量覆盖，不要把真实密钥写回本文件。
[app]
name = "amr-agent-api"
version = "0.1.0"
environment = "development"

[logging]
level = "INFO"
# true 时每条日志都是一行 JSON，便于机器解析和后续证据报告。
json = true

[model_gateway]
# 一个进程只选择一个 Profile；运行中不执行 Fast/Smart 热切换。
profile = "fast"
base_url = "http://127.0.0.1:8080/v1"
api_key = "dummy"
artifact_manifest_path = "config/fast_model_manifest.json"
# 发布/Compose 会强制为 true；仓库默认也启用，确保真实 Provider 启动前核验制品。
artifact_verification_required = true
connect_timeout_seconds = 3.0
generation_timeout_seconds = 120.0
max_schema_repair_attempts = 1
# 四步 PEVR 正常链路的 PlanTasksOutput 可能超过 1024 Token；调用节点仍会
# 通过各自 NodeContext 的请求上限和累计预算进一步收紧，网关这里只设安全上界。
max_output_tokens = 4096
# true 时 API 启动前必须通过 /v1/models alias 门禁。
validate_on_startup = true
# llama.cpp 请求级 cache_prompt。开启后复用与上一请求相同的 Token 前缀 KV。
# 共享 system 前缀必须放在各节点 Prompt 之前，跨节点才能命中这段缓存。
prompt_cache_enabled = true

[model_gateway.profiles.fast]
alias = "qwen3.6-fast"
context_window = 16384
temperature = 0.1
top_p = 0.95
top_k = 20
parallel_slots = 1
quantization = "IQ4_NL"
reasoning_enabled = false
reasoning_budget_tokens = 0
enabled = true

[model_gateway.profiles.smart]
alias = "qwen3.8-smart"
context_window = 12288
temperature = 0.0
reasoning_enabled = true
# 2026-08-21 在线 P0-05 验收仅通过 2/5；保留身份参数供审计，但 Provider 会在
# 发起任何 HTTP 请求前以 MODEL_PROFILE_DISABLED 拒绝，直到用户明确要求重新启用。
reasoning_budget_tokens = 512
enabled = false
disabled_reason = "Smart 在线 P0-05 验收仅通过 2/5，等待用户明确指示后再启用"

[database]
postgres_dsn = "postgresql://amr:123456@localhost:5432/amr_agent"

[security]
# 仅用于本地开发/冒烟；部署必须通过 AMR_JWT_SECRET 注入独立密钥。
jwt_secret = "p016-development-only-change-this-jwt-secret-2026"
hitl_signing_secret = "p016-development-only-change-this-hitl-secret-2026"
issuer = "amr-agent"
audience = "amr-agent-api"
leeway_seconds = 0

[retrieval]
qdrant_url = "http://localhost:6333"
# 开发者若使用无认证的临时 Qdrant 可保持为空；Compose/production 会拒绝空值。
# qdrant_api_key = "由 QDRANT_API_KEY 注入"
collection_name = "amr_warehouse_knowledge"
# 本地模型路径是当前 P0 固定环境；维度由运行时模型动态读取，不在配置中写死。
embedding_model_path = "E:\\Llama.cpp\\Embedding"
embedding_device = "cpu"
embedding_batch_size = 8
# 只在单个二级章节超过此上限时进行语义块二次拆分。
chunk_max_chars = 1800
default_top_k = 5
candidate_multiplier = 4
vector_weight = 0.5
bm25_weight = 0.5
bm25_saturation = 3.0
# 20 例真实评测：可答最低 0.821220、不可答最高 0.797038；取中点约 0.809。
# 模型、语料或融合方式变化后必须重新观察分布，不应永久照搬此值。
minimum_hybrid_score = 0.809
# hybrid 未达标子集：短语义改写 top vector=0.597388，不可答最高=0.400358。
minimum_vector_score = 0.499
