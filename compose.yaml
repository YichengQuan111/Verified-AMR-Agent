services:
  postgres:
    image: postgres:17
    container_name: amr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: amr
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: amr_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: amr-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: