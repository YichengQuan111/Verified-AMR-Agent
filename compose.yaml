name: amr_agent

services:
  postgres:
    image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
    container_name: amr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-amr_agent}
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # API 只在数据库接受连接后启动；pg_isready 不执行写操作。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: amr-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    networks:
      - backend
    volumes:
      - qdrant_data:/qdrant/storage
    # Qdrant 镜像不内置 curl；使用 bash 的 TCP 流读取 /readyz HTTP 状态。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200" <&3'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    image: amr-agent-api:local
    container_name: amr-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      AMR_ENV: compose
      LOG_JSON: "true"
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-amr}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-amr_agent}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      # Fast 模型仍由 Windows 脚本启动；该地址只用于 API 的主动模型检查。
      OPENAI_BASE_URL: http://host.docker.internal:8080/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      LLM_PROFILE: fast
      LLM_MODEL: qwen3.6-fast
      # 当前 Fast 脚本绑定 Windows 127.0.0.1，API 容器默认先做自身健康检查。
      # 真正模型联调仍必须在主机执行 check_model_gateway.py；可显式改为 true 做严格门禁。
      MODEL_GATEWAY_VALIDATE_ON_STARTUP: ${MODEL_GATEWAY_VALIDATE_ON_STARTUP:-false}
      FAST_MODEL_VERIFY_ARTIFACT: "true"
      FAST_MODEL_PATH: /opt/amr-fast/models/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-IQ4_NL.gguf
      LLAMA_SERVER_PATH: /opt/amr-fast/llama-server.exe
      AMR_JWT_SECRET: ${AMR_JWT_SECRET:?AMR_JWT_SECRET is required}
      AMR_HITL_SIGNING_SECRET: ${AMR_HITL_SIGNING_SECRET:?AMR_HITL_SIGNING_SECRET is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - edge
    volumes:
      # 只读挂载让容器内 Provider 能独立重算 GGUF/llama-server 哈希；模型不复制进镜像。
      - ${FAST_ARTIFACT_ROOT:?FAST_ARTIFACT_ROOT is required}:/opt/amr-fast:ro
    ports:
      - "127.0.0.1:${AMR_API_PORT:-8000}:8000"
    # 容器启动时只执行幂等前向迁移；迁移失败会阻止 API 接受请求。
    command:
      - sh
      - -c
      - >-
        python scripts/migrate_database.py upgrade &&
        exec python -m uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  qdrant_data:

networks:
  # 数据面只连接内部网络；宿主和同一局域网无法直接绕过 API/RAG ACL。
  backend:
    internal: true
  edge:
