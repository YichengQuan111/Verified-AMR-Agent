[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-agent"
version = "0.1.0"
description = "Controlled and verifiable multi-AMR warehouse orchestration platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<1.19",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<0.29",
  "jieba>=0.42,<0.43",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-postgres>=3.1,<3.2",
  "networkx>=3.6,<3.7",
  "numpy>=2.4,<2.5",
  "openai>=3.3,<3.4",
  "psycopg>=3.3,<3.4",
  "pydantic>=2.13,<2.14",
  "python-multipart>=0.0.32,<0.1",
  "PyYAML>=6.0,<7.0",
  "PyJWT>=2.13,<2.14",
  "qdrant-client>=1.19,<1.20",
  "rank-bm25>=0.2,<0.3",
  "scipy>=1.17,<1.18",
  "sentence-transformers>=6.0,<6.1",
  "SQLAlchemy>=2.0,<2.1",
  "sse-starlette>=3.4,<3.5",
  "structlog>=26.1,<26.2",
  "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<9.2",
  "pytest-asyncio>=1.4,<1.5",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["agent*", "apps*", "domains*", "services*"]

[tool.setuptools.package-data]
"agent.context" = ["prompts/*.md"]
"domains.amr_warehouse" = ["knowledge/*.md", "data/*.json"]
